spring.application.name=previsao_do_clima

# CONFIGURAÇÕES DO BANCO MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/obj_smart_clima?createDatabaseIfNotExist=true
spring.datasource.username=${usuario}
spring.datasource.password=${senha}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CHAVES DE API
openweathermap.api.key=${OPENWEATHER_KEY}
gemini.api.key=${GEMINI_KEY}

# SWAGGER CONFIG
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html